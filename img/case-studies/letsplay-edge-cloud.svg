<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">LetsPlay edge to cloud architecture pivot</title><desc id="desc">On-device inference was preferred, but TFLite runtime failure and product constraints changed the architecture to server-side GPU inference.</desc>
<rect width="1200" height="650" fill="#f7f5f0"/>
<style>.h{font:600 32px Georgia,serif;fill:#1c1916}.s{font:400 18px Georgia,serif;fill:#4a473f}.k{font:500 14px monospace;fill:#6b2a2a;letter-spacing:.04em}.t{font:600 20px Georgia,serif;fill:#1c1916}.b{font:400 15px Georgia,serif;fill:#4a473f}.m{font:500 12px monospace;fill:#6b6759}.box{fill:#eee8da;stroke:#d3c9b3;stroke-width:1.4}.accent{fill:#efe1df;stroke:#6b2a2a;stroke-width:1.5}.line{stroke:#74582f;stroke-width:2;fill:none}.bad{fill:#f7f5f0;stroke:#6b2a2a;stroke-width:1.5}</style>
<text x="55" y="66" class="k">ARCHITECTURE DECISION</text><text x="55" y="106" class="h">A converted model was not evidence of a deployable model</text><text x="55" y="141" class="s">Runtime evidence, recognition quality, and project constraints overruled the preferred edge architecture.</text>
<rect x="65" y="215" rx="10" width="230" height="175" class="box"/><text x="90" y="248" class="m">PREFERRED DIRECTION</text><text x="90" y="286" class="t">On-device STT</text><text x="90" y="322" class="b">lower network dependence</text><text x="90" y="348" class="b">mobile inference target</text>
<rect x="355" y="185" rx="10" width="270" height="235" class="bad"/><text x="380" y="220" class="m">ONNX → TFLITE</text><text x="380" y="258" class="t">Conversion ✓</text><text x="380" y="294" class="t">Inference ✕</text><text x="380" y="331" class="b">abnormal repeated characters</text><text x="380" y="357" class="b">root cause not overclaimed</text><text x="380" y="390" class="m">possible operator / dynamic tensor issues</text>
<rect x="685" y="215" rx="10" width="220" height="175" class="box"/><text x="710" y="248" class="m">ALTERNATIVE CHECK</text><text x="710" y="286" class="t">OpenVINO INT8</text><text x="710" y="322" class="b">conversion ✓</text><text x="710" y="348" class="b">CPU inference ✓</text>
<rect x="965" y="185" rx="10" width="175" height="235" class="accent"/><text x="990" y="220" class="m">PRODUCT DECISION</text><text x="990" y="258" class="t">Cloud GPU</text><text x="990" y="294" class="b">server-side inference</text><text x="990" y="320" class="b">under deadline +</text><text x="990" y="346" class="b">quality constraints</text><text x="990" y="390" class="m">architecture pivot</text>
<path d="M295 300 H355" class="line"/><path d="M625 300 H685" class="line"/><path d="M905 300 H965" class="line"/>
<rect x="185" y="490" rx="10" width="830" height="90" class="accent"/><text x="600" y="526" text-anchor="middle" class="t">Decision question changed</text><text x="600" y="555" text-anchor="middle" class="b">Not “Can edge eventually be made to work?” but “Is edge still the rational product choice now?”</text>
</svg>