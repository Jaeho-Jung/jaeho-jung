<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">TetoEgen hairstyle recommendation evidence chain</title><desc id="desc">From image quality to continuous facial geometry, target silhouette, rule activation, and ranked recommendation.</desc>
<rect width="1200" height="720" fill="#f7f5f0"/>
<style>.h{font:600 32px Georgia,serif;fill:#1c1916}.s{font:400 18px Georgia,serif;fill:#4a473f}.k{font:500 14px monospace;fill:#6b2a2a;letter-spacing:.04em}.t{font:600 20px Georgia,serif;fill:#1c1916}.b{font:400 15px Georgia,serif;fill:#4a473f}.m{font:500 12.5px monospace;fill:#6b6759}.box{fill:#eee8da;stroke:#d3c9b3;stroke-width:1.4}.accent{fill:#efe1df;stroke:#6b2a2a;stroke-width:1.5}.line{stroke:#74582f;stroke-width:2;fill:none}.pill{fill:#f7f5f0;stroke:#d3c9b3;stroke-width:1}</style>
<text x="55" y="65" class="k">EVIDENCE CHAIN</text><text x="55" y="105" class="h">From face image to explainable hairstyle recommendation</text><text x="55" y="140" class="s">The display label remains readable for UX; the recommendation is driven by continuous measurements.</text>
<rect x="55" y="205" rx="10" width="205" height="190" class="box"/><text x="78" y="238" class="m">1 · INPUT QUALITY</text><text x="78" y="273" class="t">Pose gate</text><text x="78" y="305" class="b">roll · yaw · pitch</text><text x="78" y="330" class="b">single-face check</text><text x="78" y="355" class="b">roll normalization</text><text x="78" y="380" class="b">reject / usable / good</text>
<rect x="300" y="205" rx="10" width="245" height="270" class="box"/><text x="323" y="238" class="m">2 · CONTINUOUS PROFILE</text><text x="323" y="273" class="t">Facial geometry</text><text x="323" y="308" class="b">elongation</text><text x="323" y="333" class="b">forehead ↔ cheek</text><text x="323" y="358" class="b">jaw ↔ cheek / taper</text><text x="323" y="383" class="b">upper · middle · lower thirds</text><text x="323" y="408" class="b">jaw angularity</text><text x="323" y="433" class="b">symmetry deviation</text>
<rect x="585" y="205" rx="10" width="250" height="270" class="accent"/><text x="608" y="238" class="m">3 · SILHOUETTE ENGINE v2.0</text><text x="608" y="273" class="t">Target geometry</text><rect x="608" y="300" rx="12" width="92" height="26" class="pill"/><text x="654" y="318" text-anchor="middle" class="m">crownHeight</text><rect x="710" y="300" rx="12" width="102" height="26" class="pill"/><text x="761" y="318" text-anchor="middle" class="m">sideWidth</text><rect x="608" y="338" rx="12" width="108" height="26" class="pill"/><text x="662" y="356" text-anchor="middle" class="m">fringeCoverage</text><rect x="726" y="338" rx="12" width="86" height="26" class="pill"/><text x="769" y="356" text-anchor="middle" class="m">softness</text><rect x="608" y="376" rx="12" width="108" height="26" class="pill"/><text x="662" y="394" text-anchor="middle" class="m">horizontalFlow</text><rect x="726" y="376" rx="12" width="86" height="26" class="pill"/><text x="769" y="394" text-anchor="middle" class="m">layering</text><text x="608" y="435" class="b">User intent modifies the same target:</text><text x="608" y="459" class="b">natural · soft · structured · expressive</text>
<rect x="875" y="205" rx="10" width="270" height="270" class="box"/><text x="898" y="238" class="m">4 · RANK + EXPLAIN</text><text x="898" y="273" class="t">Recommendation</text><text x="898" y="310" class="b">silhouette fit</text><text x="898" y="335" class="b">intent / preference fit</text><text x="898" y="360" class="b">feasibility / maintenance</text><text x="898" y="385" class="b">diversity penalty</text><text x="898" y="425" class="b">+ active rules retained</text><text x="898" y="450" class="b">for user-facing explanation</text>
<path d="M260 300 H300" class="line"/><path d="M545 340 H585" class="line"/><path d="M835 340 H875" class="line"/>
<text x="55" y="535" class="k">EXAMPLE REASONING, NOT A FACE-SHAPE LOOKUP</text><rect x="55" y="560" rx="10" width="1090" height="100" class="box"/><text x="80" y="597" class="b">vertical emphasis ↑  →  crown height ↓ · side width / horizontal flow ↑</text><text x="80" y="626" class="b">upper-third proportion ↑  →  fringe coverage ↑  · parting openness adjusted according to style intent</text><text x="80" y="650" class="m">Readable label is presentation metadata; underlying measurements drive the rule activations.</text>
</svg>