<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">LetsPlay data augmentation versus generalization evidence</title><desc id="desc">200 original utterances were expanded to 4200 files, but in-distribution performance was explicitly separated from real child-speech generalization.</desc>
<rect width="1200" height="660" fill="#f7f5f0"/>
<style>.h{font:600 32px Georgia,serif;fill:#1c1916}.s{font:400 18px Georgia,serif;fill:#4a473f}.k{font:500 14px monospace;fill:#6b2a2a;letter-spacing:.04em}.big{font:600 48px Georgia,serif;fill:#1c1916}.t{font:600 19px Georgia,serif;fill:#1c1916}.b{font:400 15px Georgia,serif;fill:#4a473f}.m{font:500 12px monospace;fill:#6b6759}.box{fill:#eee8da;stroke:#d3c9b3;stroke-width:1.4}.accent{fill:#efe1df;stroke:#6b2a2a;stroke-width:1.5}.line{stroke:#74582f;stroke-width:2;fill:none}</style>
<text x="55" y="66" class="k">EXPERIMENT DESIGN</text><text x="55" y="106" class="h">More training files did not equal more target-domain evidence</text><text x="55" y="141" class="s">Augmentation increased diversity inside a constrained task; it did not create independent child-speech evidence.</text>
<rect x="65" y="220" rx="10" width="220" height="205" class="box"/><text x="88" y="253" class="m">ORIGINAL DATA</text><text x="88" y="312" class="big">≈200</text><text x="88" y="345" class="b">short Korean utterances</text><text x="88" y="370" class="b">small target vocabulary</text>
<rect x="365" y="195" rx="10" width="285" height="255" class="box"/><text x="390" y="230" class="m">AUGMENTATION</text><text x="390" y="270" class="t">Synthetic variation</text><text x="390" y="306" class="b">SpecAugment / SpecSwap</text><text x="390" y="332" class="b">frequency filtering</text><text x="390" y="358" class="b">noise mixing at controlled SNR</text><text x="390" y="384" class="b">reverberation</text><text x="390" y="410" class="b">speed perturbation</text>
<rect x="730" y="220" rx="10" width="220" height="205" class="box"/><text x="755" y="253" class="m">TRAINING SET</text><text x="755" y="312" class="big">≈4,200</text><text x="755" y="345" class="b">~21× file count</text><text x="755" y="370" class="b">derived from limited originals</text>
<rect x="990" y="195" rx="10" width="165" height="255" class="accent"/><text x="1015" y="230" class="m">BOUNDARY</text><text x="1015" y="270" class="t">Do not infer</text><text x="1015" y="306" class="b">near-perfect</text><text x="1015" y="329" class="b">in-distribution CER</text><text x="1015" y="352" class="b">⇒ real child-speech</text><text x="1015" y="375" class="b">generalization</text><text x="1015" y="414" class="m">needs fixed target-domain test</text>
<path d="M285 320 H365" class="line"/><path d="M650 320 H730" class="line"/><path d="M950 320 H990" class="line"/>
<rect x="205" y="515" rx="10" width="790" height="84" class="accent"/><text x="600" y="550" text-anchor="middle" class="t">Two different claims</text><text x="600" y="578" text-anchor="middle" class="b">“Can the model learn this constrained dataset?” ≠ “Will it generalize to actual child speech?”</text>
</svg>