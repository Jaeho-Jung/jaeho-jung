<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">TetoEgen evidence and failure boundary</title><desc id="desc">A claim is only trusted when input quality, runtime contract, behavior evidence, and privacy-safe observability support it.</desc>
<rect width="1200" height="620" fill="#f7f5f0"/>
<style>.h{font:600 32px Georgia,serif;fill:#1c1916}.s{font:400 18px Georgia,serif;fill:#4a473f}.k{font:500 14px monospace;fill:#6b2a2a;letter-spacing:.04em}.t{font:600 20px Georgia,serif;fill:#1c1916}.b{font:400 15px Georgia,serif;fill:#4a473f}.m{font:500 12px monospace;fill:#6b6759}.box{fill:#eee8da;stroke:#d3c9b3;stroke-width:1.4}.good{fill:#efe1df;stroke:#6b2a2a;stroke-width:1.5}.line{stroke:#74582f;stroke-width:2;fill:none}</style>
<text x="55" y="66" class="k">REVIEW FRAME</text><text x="55" y="106" class="h">A generated result is not automatically a supported claim</text><text x="55" y="141" class="s">Trust requires explicit input, runtime, behavior, and observability boundaries.</text>
<rect x="65" y="215" rx="10" width="220" height="185" class="box"/><text x="88" y="248" class="m">INPUT</text><text x="88" y="282" class="t">Can we measure it?</text><text x="88" y="315" class="b">single face</text><text x="88" y="339" class="b">pose / crop quality</text><text x="88" y="363" class="b">explicit reject states</text>
<rect x="335" y="215" rx="10" width="220" height="185" class="box"/><text x="358" y="248" class="m">RUNTIME</text><text x="358" y="282" class="t">Is the contract valid?</text><text x="358" y="315" class="b">model ↔ metadata</text><text x="358" y="339" class="b">finite outputs</text><text x="358" y="363" class="b">retryable initialization</text>
<rect x="605" y="215" rx="10" width="220" height="185" class="good"/><text x="628" y="248" class="m">BEHAVIOR</text><text x="628" y="282" class="t">Why this result?</text><text x="628" y="315" class="b">active rules / score path</text><text x="628" y="339" class="b">confidence boundary</text><text x="628" y="363" class="b">testable recommendation logic</text>
<rect x="875" y="215" rx="10" width="260" height="185" class="box"/><text x="898" y="248" class="m">OBSERVABILITY</text><text x="898" y="282" class="t">Can we learn safely?</text><text x="898" y="315" class="b">typed funnel events</text><text x="898" y="339" class="b">telemetry cannot block UX</text><text x="898" y="363" class="b">sensitive inputs excluded</text>
<path d="M285 307 H335" class="line"/><path d="M555 307 H605" class="line"/><path d="M825 307 H875" class="line"/>
<rect x="280" y="470" rx="12" width="640" height="86" class="good"/><text x="600" y="505" text-anchor="middle" class="t">Claim → Mechanism → Evidence → Failure boundary → Decision</text><text x="600" y="532" text-anchor="middle" class="m">Only then decide whether the feature is ready, uncertain, or blocked.</text>
</svg>