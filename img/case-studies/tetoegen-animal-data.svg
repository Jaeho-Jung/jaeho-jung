<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Animal-face dataset collection and evaluation pipeline</title><desc id="desc">A reviewed pipeline with source evidence, quality gating, identity-disjoint splits, augmentation, balancing, lineage, and evaluation.</desc>
<rect width="1200" height="710" fill="#f7f5f0"/>
<style>.h{font:600 32px Georgia,serif;fill:#1c1916}.s{font:400 18px Georgia,serif;fill:#4a473f}.k{font:500 14px monospace;fill:#6b2a2a;letter-spacing:.04em}.t{font:600 18px Georgia,serif;fill:#1c1916}.b{font:400 14.5px Georgia,serif;fill:#4a473f}.m{font:500 12px monospace;fill:#6b6759}.box{fill:#eee8da;stroke:#d3c9b3;stroke-width:1.4}.accent{fill:#efe1df;stroke:#6b2a2a;stroke-width:1.5}.line{stroke:#74582f;stroke-width:2;fill:none}</style>
<text x="55" y="66" class="k">ML DATA PIPELINE</text><text x="55" y="106" class="h">Preventing identity leakage before trusting classifier metrics</text><text x="55" y="140" class="s">Dataset construction is part of the model contract, not a preprocessing footnote.</text>
<rect x="48" y="210" rx="10" width="170" height="130" class="box"/><text x="68" y="240" class="m">1 · DISCOVER</text><text x="68" y="274" class="t">Sources</text><text x="68" y="303" class="b">evidence URL</text><text x="68" y="326" class="b">candidate image URL</text>
<rect x="248" y="210" rx="10" width="170" height="160" class="box"/><text x="268" y="240" class="m">2 · QUALITY GATE</text><text x="268" y="274" class="t">Face crop</text><text x="268" y="303" class="b">same detector assumptions</text><text x="268" y="326" class="b">no artificial padding</text><text x="268" y="349" class="b">no excessive upscaling</text>
<rect x="448" y="210" rx="10" width="170" height="160" class="accent"/><text x="468" y="240" class="m">3 · HUMAN REVIEW</text><text x="468" y="274" class="t">Accept / reject</text><text x="468" y="303" class="b">visual crop review</text><text x="468" y="326" class="b">identity assignment</text><text x="468" y="349" class="b">rights: review-required</text>
<rect x="648" y="210" rx="10" width="205" height="190" class="box"/><text x="668" y="240" class="m">4 · SPLIT BY IDENTITY</text><text x="668" y="274" class="t">8 / 1 / 1</text><text x="668" y="303" class="b">train / validation / test</text><text x="668" y="336" class="b">Different images of one</text><text x="668" y="359" class="b">celebrity never cross splits.</text><text x="668" y="382" class="m">blocks identity leakage</text>
<rect x="883" y="210" rx="10" width="265" height="190" class="box"/><text x="903" y="240" class="m">5 · AUGMENT + BALANCE</text><text x="903" y="274" class="t">Class-controlled output</text><text x="903" y="303" class="b">flip · ±7° rotation</text><text x="903" y="326" class="b">brightness 0.90 / 1.10</text><text x="903" y="359" class="b">preserve reviewed originals</text><text x="903" y="382" class="b">balance upload folders separately</text>
<path d="M218 275 H248" class="line"/><path d="M418 290 H448" class="line"/><path d="M618 290 H648" class="line"/><path d="M853 300 H883" class="line"/>
<rect x="160" y="475" rx="10" width="390" height="130" class="box"/><text x="185" y="509" class="m">LINEAGE</text><text x="185" y="542" class="t">manifest.jsonl</text><text x="185" y="570" class="b">source · evidence · crop config · fallback · original↔augmentation</text>
<rect x="650" y="475" rx="10" width="390" height="130" class="accent"/><text x="675" y="509" class="m">EVALUATION BOUNDARY</text><text x="675" y="542" class="t">Performance, not file count</text><text x="675" y="570" class="b">per-class precision / recall · confusion matrix · fixed identity-disjoint set</text>
<path d="M600 400 V440 H355 V475" class="line"/><path d="M785 400 V440 H845 V475" class="line"/>
<text x="600" y="663" text-anchor="middle" class="m">A large augmented folder is not evidence of generalization if identity leakage remains possible.</text>
</svg>